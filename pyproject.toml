[project]
name = "rag"
version = "0.2.0"
description = "FastAPI service for Arabic and English retrieval-augmented question answering"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "huggingface-hub>=1.32.0",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.16.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.14,<2.15",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
client = [
    "requests>=2.32.0",
    "streamlit>=1.64.0",
]

[project.scripts]
rag = "rag.core:main"
rag-ingest = "rag.ingest:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.0",
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
